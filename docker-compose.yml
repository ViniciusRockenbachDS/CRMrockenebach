name: crm

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco separado para a suíte de testes (pytest) — não compartilha dados com o dev.
  postgres-test:
    image: postgres:16-alpine
    container_name: crm-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: crm_test
      POSTGRES_PASSWORD: crm_test
      POSTGRES_DB: crm_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # Interface web opcional: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: crm-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@crm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  crm_pgdata:
